<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bienvenido a Talent Finder</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
        background-color: #f0f1f5;
      }
      table {
        border-collapse: collapse;
        width: 100%;
      }
      td {
        padding: 0;
      }
      .email-wrapper {
        max-width: 520px;
        margin: 0 auto;
      }
      @media (max-width: 640px) {
        .email-wrapper {
          max-width: 100%;
        }
        .email-wrapper table {
          width: 100% !important;
        }
      }
    </style>
  </head>
  <body style="margin: 0; padding: 0; background-color: #f0f1f5">
    <table width="100%" cellpadding="0" cellspacing="0" style="background-color: #f0f1f5">
      <tr>
        <td align="center" style="padding: 40px 20px">
          <table
            class="email-wrapper"
            cellpadding="0"
            cellspacing="0"
            style="
              background-color: #ffffff;
              border-radius: 12px;
              width: 520px;
              max-width: 100%;
              margin: 0 auto;
            "
          >
            <!-- Header with Logo and Title -->
            <tr>
              <td style="padding: 30px 24px; text-align: center">
                <table width="100%" cellpadding="0" cellspacing="0" style="margin-bottom: 20px">
                  <tr>
                    <td style="text-align: center">
                      <img
                        src="https://f04xv9yhhl-xkxh86_0fcnxkiy_dy6ib-wzqruaubgo.canva-cdn.email/68786cbcdbe0006fb18e581a9a8d9fef.png"
                        width="38"
                        height="39"
                        style="display: inline-block; vertical-align: middle; margin-right: 8px"
                        alt="Logo"
                      />
                      <span
                        style="
                          font-size: 29px;
                          font-weight: 700;
                          color: #0e1b10;
                          display: inline-block;
                          vertical-align: middle;
                        "
                      >
                        <span style="color: #0d6efd">Talent</span
                        ><span style="color: #0e1b10"> Finder</span>
                      </span>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>

            <!-- Main Image -->
            <tr>
              <td style="padding: 0 24px 20px">
                <img
                  src="https://f04xv9yhhl-xkxh86_0fcnxkiy_dy6ib-wzqruaubgo.canva-cdn.email/a489d092c6f3597368e0b2cd6ff8196b.png"
                  width="552"
                  height="414"
                  style="display: block; width: 100%; height: auto; max-width: 100%"
                  alt="Features"
                />
              </td>
            </tr>

            <!-- Features Text -->
            <tr>
              <td style="padding: 0 24px 0; text-align: center; color: #0e1b10; font-size: 18px">
                <div style="margin: 12px 0"><strong>Semantic CV</strong> search powered by AI</div>
              </td>
            </tr>
            <tr>
              <td style="padding: 0 24px 0; text-align: center; color: #0e1b10; font-size: 18px">
                <div style="margin: 12px 0">
                  <strong>Instant candidate</strong> matching with context
                </div>
              </td>
            </tr>
            <tr>
              <td style="padding: 0 24px 0; text-align: center; color: #0e1b10; font-size: 18px">
                <div style="margin: 12px 0">
                  <strong>Secure,</strong> private-by-design infrastructure
                </div>
              </td>
            </tr>

            <!-- Divider -->
            <tr>
              <td style="padding: 20px 24px; text-align: center">
                <div style="height: 1px; background-color: #bfc3c8"></div>
              </td>
            </tr>

            <!-- Main Message -->
            <tr>
              <td style="padding: 20px 24px; text-align: center">
                <h2 style="margin: 0; color: #0e1b10; font-size: 28px; font-weight: 700">
                  {{ORG_NAME}} is ready
                </h2>
              </td>
            </tr>

            <!-- CTA Button -->
            <tr>
              <td style="padding: 20px 24px; text-align: center">
                <a
                  href="{{CTA_URL}}"
                  style="
                    display: inline-block;
                    background-color: #0d6efd;
                    color: #ffffff;
                    text-decoration: none;
                    padding: 14px 32px;
                    border-radius: 50px;
                    font-weight: 700;
                    font-size: 16px;
                  "
                  >Go to dashboard</a
                >
              </td>
            </tr>

            <!-- Spacing -->
            <tr>
              <td style="padding: 20px 24px; text-align: center; color: #ffffff; font-size: 1px">
                &nbsp;
              </td>
            </tr>

            <!-- Footer -->
            <tr>
              <td style="padding: 20px 24px; text-align: center; color: #4a5c68; font-size: 14px">
                Made with ❤️ by devYranzo
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
